<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Ujian CBT Terpadu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Library SheetJS untuk Ekspor/Impor Excel & CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        /* Custom Styles */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .hidden { display: none !important; }
        
        /* Print Styles for PDF Generation */
        @media print {
            @page { size: A4; margin: 20mm; }
            body { background-color: white; color: #000; font-family: 'Times New Roman', Times, serif; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            .print-container { width: 100%; }
            table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 11pt; }
            table, th, td { border: 1px solid #000; }
            th { padding: 10px 8px; text-align: center; background-color: #f0f0f0 !important; -webkit-print-color-adjust: exact; font-weight: bold; }
            td { padding: 8px; vertical-align: middle; }
            .print-header { text-align: center; margin-bottom: 25px; border-bottom: 3px double #000; padding-bottom: 15px; }
            .print-header h1 { font-size: 16pt; margin: 0 0 5px 0; font-weight: bold; text-transform: uppercase; }
            .print-header h2 { font-size: 14pt; margin: 0 0 5px 0; font-weight: normal; }
            .print-header p { font-size: 12pt; margin: 0; }
            .print-signature { margin-top: 50px; display: flex; justify-content: space-between; page-break-inside: avoid; font-size: 11pt; }
            .text-center { text-align: center; }
            .font-bold { font-weight: bold; }
            /* Participant Card Styles */
            .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
            .peserta-card { border: 2px solid #000; padding: 15px; border-radius: 8px; break-inside: avoid; position: relative; font-family: 'Segoe UI', sans-serif; }
            .card-header-box { text-align: center; border-bottom: 2px solid #000; margin-bottom: 10px; padding-bottom: 5px; }
            .card-header-box h3 { margin: 0; font-size: 14pt; font-weight: bold; text-transform: uppercase; }
            .card-header-box p { margin: 2px 0 0; font-size: 10pt; }
            .card-body-table { width: 100%; border: none; margin-top: 5px; }
            .card-body-table td { border: none; padding: 4px; font-size: 11pt; }
        }
        .print-only { display: none; }
        
        /* Exam Layout */
        .exam-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 10px; }
        .btn-number { width: 40px; height: 40px; border-radius: 5px; font-weight: bold; cursor: pointer; border: 1px solid #ccc; background: #374151; color: white; transition: all 0.2s; }
        .btn-number.answered { background: #10b981; color: white; border-color: #059669; }
        .btn-number.ragu { background: #eab308; color: black; border-color: #ca8a04; }
        .btn-number.active { outline: 3px solid #60a5fa; outline-offset: 2px; border-color: transparent; }
    </style>
</head>
<body class="text-gray-800">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center bg-blue-900 px-4">
        <div class="bg-white p-8 rounded-lg shadow-2xl w-full max-w-md">
            <div class="text-center mb-8">
                <i class="fas fa-graduation-cap text-5xl text-blue-600 mb-4"></i>
                <h1 class="text-2xl font-bold text-gray-800">CBT System Portal</h1>
                <p class="text-gray-500 text-sm">Masuk untuk melanjutkan</p>
            </div>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Role Akses</label>
                    <select id="loginRole" class="mt-1 w-full px-4 py-2 border rounded-md focus:ring-blue-500 focus:border-blue-500" required>
                        <option value="siswa">Peserta / Siswa</option>
                        <option value="guru">Guru / Pengawas</option>
                        <option value="admin">Administrator</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Username</label>
                    <input type="text" id="username" class="mt-1 w-full px-4 py-2 border rounded-md focus:ring-blue-500 focus:border-blue-500" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="password" class="mt-1 w-full px-4 py-2 border rounded-md focus:ring-blue-500 focus:border-blue-500" required>
                    <div class="mt-2 flex items-center">
                        <input type="checkbox" id="showPassword" class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 border-gray-300 cursor-pointer" onchange="document.getElementById('password').type = this.checked ? 'text' : 'password'">
                        <label for="showPassword" class="ml-2 text-sm text-gray-600 cursor-pointer select-none">Tampilkan Password</label>
                    </div>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 transition font-bold mt-2">LOGIN</button>
            </form>
        </div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="mainApp" class="hidden min-h-screen flex flex-col no-print">
        <!-- Navbar -->
        <nav class="bg-blue-800 text-white shadow-md">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16 items-center">
                    <div class="flex items-center gap-2">
                        <i class="fas fa-laptop-code text-2xl"></i>
                        <span class="font-bold text-xl">e-CBT PRO</span>
                    </div>
                    <div class="flex items-center gap-4">
                        <span id="navUserInfo" class="font-medium text-sm bg-blue-700 px-3 py-1 rounded-full"></span>
                        <button onclick="logout()" class="hover:text-red-300 transition"><i class="fas fa-sign-out-alt"></i> Logout</button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Dynamic Content Area -->
        <main id="contentArea" class="flex-grow p-4 md:p-8 max-w-7xl mx-auto w-full"></main>
    </div>

    <!-- PRINT CONTAINERS -->
    <div id="printArea" class="print-only print-container"></div>

    <script>
        /* ==================== DATABASE SIMULATION (LocalStorage) ==================== */
        const DB_KEY = 'cbt_database_v3'; 
        
        let db = {
            users: [
                { id: 'u1', username: 'admin', password: '123', role: 'admin', name: 'Administrator' },
                { id: 'u2', username: 'guru1', password: '123', role: 'guru', name: 'Budi Santoso', subjectIds: ['m1'] },
                { id: 'u3', username: 'siswa1', password: '123', role: 'siswa', name: 'Andi M', kelas: 'XII-IPA-1', noUjian: 'U-001' }
            ],
            subjects: [
                { id: 'm1', name: 'Matematika', allowedClasses: [], randomizeQuestions: false, randomizeOptions: false },
                { id: 'm2', name: 'Bahasa Indonesia', allowedClasses: [], randomizeQuestions: false, randomizeOptions: false }
            ],
            classes: [
                { id: 'c1', name: 'XII-IPA-1' },
                { id: 'c2', name: 'XII-IPS-1' }
            ],
            schoolInfo: {
                name: 'SMA Negeri 1 Contoh',
                address: 'Jl. Pendidikan No. 1, Kota Belajar',
                academicYear: '2023/2024',
                semester: 'Genap',
                examType: 'Ujian Akhir Semester'
            },
            questions: [],
            examSettings: {
                isRunning: false,
                token: 'XYZ123',
                activeSubjectIds: ['m1'],
                kkm: 70,
                duration: 120 // in minutes
            },
            examResults: [], // { studentId, subjectId, score, status, answers: {}, doubtful: {}, endTime: timestamp }
            beritaAcara: {}, // { subjectId: { tanggal, terdaftar, hadir, absen, noAbsen, catatan, pengawasName } }
            schedules: [] // { id, date, time, subjectId }
        };

        function initDB() {
            let stored = localStorage.getItem(DB_KEY);
            if (!stored) {
                // Auto Migrate from old version
                let old = localStorage.getItem('cbt_database_v2');
                if(old) {
                    db = JSON.parse(old);
                    db.users.forEach(u => { if(u.role==='guru' && !u.subjectIds) u.subjectIds = u.subjectId ? [u.subjectId] : []; });
                    if(!db.examSettings.duration) db.examSettings.duration = 120;
                    if(!db.beritaAcara) db.beritaAcara = {};
                    if(!db.schedules) db.schedules = [];
                    if(!db.classes) db.classes = [];
                    if(!db.schoolInfo) db.schoolInfo = { name: '', address: '', academicYear: '', semester: '', examType: '' };
                    
                    // Migrate activeSubjectId to array
                    if(db.examSettings.activeSubjectId !== undefined) {
                        db.examSettings.activeSubjectIds = db.examSettings.activeSubjectId ? [db.examSettings.activeSubjectId] : [];
                        delete db.examSettings.activeSubjectId;
                    }
                    if(!db.examSettings.activeSubjectIds) db.examSettings.activeSubjectIds = [];

                    db.subjects.forEach(s => { 
                        if(!s.allowedClasses) s.allowedClasses = []; 
                        if(s.randomizeQuestions === undefined) s.randomizeQuestions = false;
                        if(s.randomizeOptions === undefined) s.randomizeOptions = false;
                    });
                    db.examResults.forEach(r => { if(!r.doubtful) r.doubtful = {}; });
                    saveDB();
                } else { saveDB(); }
            } else {
                db = JSON.parse(stored);
                if(!db.schedules) db.schedules = [];
                if(!db.classes) db.classes = [];
                if(!db.schoolInfo) db.schoolInfo = { name: '', address: '', academicYear: '', semester: '', examType: '' };
                
                // Migrate activeSubjectId to array if missed
                if(db.examSettings.activeSubjectId !== undefined) {
                    db.examSettings.activeSubjectIds = db.examSettings.activeSubjectId ? [db.examSettings.activeSubjectId] : [];
                    delete db.examSettings.activeSubjectId;
                }
                if(!db.examSettings.activeSubjectIds) db.examSettings.activeSubjectIds = [];

                db.subjects.forEach(s => { 
                    if(!s.allowedClasses) s.allowedClasses = [];
                    if(s.randomizeQuestions === undefined) s.randomizeQuestions = false;
                    if(s.randomizeOptions === undefined) s.randomizeOptions = false;
                });
            }
        }
        function saveDB() { localStorage.setItem(DB_KEY, JSON.stringify(db)); }
        function generateId() { return Math.random().toString(36).substr(2, 9); }

        /* ==================== STATE MANAGEMENT ==================== */
        let currentUser = null;
        let currentStudentSubjectId = null; // Mapel aktif yang sedang dikerjakan Siswa
        let currentAnswers = {}; 
        let currentDoubtful = {};
        let cheatWarnings = 0;
        let examTimerInterval = null;
        let editUserId = null; // State untuk fitur Edit User
        let isFinishingExam = false; // Flag untuk mengamankan proses keluar ujian dari sistem anti-cheat

        /* ==================== UTILITIES ==================== */
        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 600; 
                    let width = img.width, height = img.height;
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.7));
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        /* ==================== CORE APP LOGIC ==================== */
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const r = document.getElementById('loginRole').value;
            const u = document.getElementById('username').value, p = document.getElementById('password').value;
            const user = db.users.find(x => x.username === u && x.password === p && x.role === r);
            if (user) {
                currentUser = user;
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                let roleDisp = user.role.toUpperCase();
                if(user.role === 'siswa') roleDisp += ` | ${user.kelas}`;
                document.getElementById('navUserInfo').innerText = `${user.name} (${roleDisp})`;
                routeUser();
            } else { alert('Username, Password, atau Role Akses salah!'); }
        });

        function logout() {
            currentUser = null; currentStudentSubjectId = null; clearInterval(examTimerInterval);
            document.getElementById('mainApp').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('loginForm').reset();
            document.getElementById('password').type = 'password';
            if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
        }

        function routeUser() {
            const area = document.getElementById('contentArea');
            if (currentUser.role === 'admin') renderAdmin(area);
            else if (currentUser.role === 'guru') { guruActiveTab = 'soal'; renderGuru(area); }
            else if (currentUser.role === 'siswa') renderSiswa(area);
        }

        /* ==================== ADMIN MODULE ==================== */
        function renderAdmin(container) {
            container.innerHTML = `
                <div class="flex gap-2 mb-6 border-b pb-2 overflow-x-auto text-sm">
                    <button onclick="switchAdminTab('siswa')" class="px-4 py-2 bg-blue-100 text-blue-800 rounded font-semibold admin-tab">Data Siswa</button>
                    <button onclick="switchAdminTab('guru')" class="px-4 py-2 bg-gray-100 rounded hover:bg-gray-200 admin-tab">Data Guru</button>
                    <button onclick="switchAdminTab('kelompok')" class="px-4 py-2 bg-gray-100 rounded hover:bg-gray-200 admin-tab">Kelompok Kelas</button>
                    <button onclick="switchAdminTab('mapel')" class="px-4 py-2 bg-gray-100 rounded hover:bg-gray-200 admin-tab">Mata Pelajaran</button>
                    <button onclick="switchAdminTab('jadwal')" class="px-4 py-2 bg-gray-100 rounded hover:bg-gray-200 admin-tab">Jadwal Ujian</button>
                    <button onclick="switchAdminTab('proktor')" class="px-4 py-2 bg-gray-100 rounded hover:bg-gray-200 admin-tab">Proktor & Status</button>
                    <button onclick="switchAdminTab('pengaturan')" class="px-4 py-2 bg-gray-100 rounded hover:bg-gray-200 admin-tab">Pengaturan</button>
                    <button onclick="switchAdminTab('laporan')" class="px-4 py-2 bg-gray-100 rounded hover:bg-gray-200 admin-tab">Laporan</button>
                </div>
                <div id="adminContent"></div>
            `;
            switchAdminTab('siswa');
        }

        function switchAdminTab(tab) {
            document.querySelectorAll('.admin-tab').forEach(el => {
                el.classList.remove('bg-blue-100', 'text-blue-800', 'font-semibold'); el.classList.add('bg-gray-100');
            });
            if(event && event.target) {
                event.target.classList.add('bg-blue-100', 'text-blue-800', 'font-semibold'); event.target.classList.remove('bg-gray-100');
            }

            const content = document.getElementById('adminContent');
            const mapelOptions = db.subjects.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
            const kelasOptions = db.classes.map(c => `<option value="${c.name}">${c.name}</option>`).join('');

            if (tab === 'siswa') {
                let rows = db.users.filter(u => u.role === 'siswa').map(u => `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-2 text-center"><input type="checkbox" class="chk-siswa w-4 h-4 cursor-pointer" value="${u.id}"></td>
                        <td class="p-2">${u.noUjian || '-'}</td>
                        <td class="p-2">${u.username}</td>
                        <td class="p-2">${u.name}</td>
                        <td class="p-2">${u.kelas || '-'}</td>
                        <td class="p-2 flex gap-3">
                            <button onclick="editUser('${u.id}', 'siswa')" class="text-blue-500 hover:text-blue-700" title="Edit Data"><i class="fas fa-edit"></i></button>
                            <button onclick="deleteUser('${u.id}', 'siswa')" class="text-red-500 hover:text-red-700" title="Hapus"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `).join('');
                content.innerHTML = `
                    <div class="bg-white p-6 rounded shadow">
                        <h2 class="text-xl font-bold mb-4" id="form_title_siswa">Input Data Siswa</h2>
                        <form id="addSiswaForm" class="grid grid-cols-1 md:grid-cols-5 gap-4 mb-6 bg-gray-50 p-4 border rounded">
                            <div><label class="block text-xs font-bold mb-1">No. Ujian</label><input type="text" id="s_no" placeholder="No. Ujian" class="border p-2 rounded w-full" required></div>
                            <div><label class="block text-xs font-bold mb-1">Username</label><input type="text" id="s_user" placeholder="Username" class="border p-2 rounded w-full" required></div>
                            <div><label class="block text-xs font-bold mb-1">Password</label><input type="text" id="s_pass" placeholder="Password" class="border p-2 rounded w-full" required></div>
                            <div><label class="block text-xs font-bold mb-1">Nama Lengkap</label><input type="text" id="s_name" placeholder="Nama Lengkap" class="border p-2 rounded w-full" required></div>
                            <div><label class="block text-xs font-bold mb-1">Kelompok Kelas</label><select id="s_kelas" class="border p-2 rounded w-full" required><option value="">Pilih Kelas...</option>${kelasOptions}</select></div>
                            <div class="md:col-span-5 flex gap-2">
                                <button type="button" id="btn_submit_siswa" onclick="addUser('siswa')" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 font-bold shadow">Tambah Siswa</button>
                                <button type="button" id="btn_cancel_siswa" onclick="cancelEdit('siswa')" class="hidden bg-gray-400 text-white px-4 py-2 rounded hover:bg-gray-500 font-bold shadow">Batal Edit</button>
                            </div>
                        </form>
                        <div class="flex justify-between items-center mb-2">
                            <h2 class="text-lg font-bold">Daftar Siswa</h2>
                            <div class="flex gap-2">
                                <button onclick="document.getElementById('import_siswa').click()" class="bg-green-600 text-white px-3 py-1.5 rounded text-sm hover:bg-green-700 shadow font-bold flex items-center gap-1"><i class="fas fa-file-excel"></i> Impor Data</button>
                                <input type="file" id="import_siswa" class="hidden" accept=".csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.ms-excel" onchange="importData(event, 'siswa')">
                                <button onclick="printKartuPeserta()" class="bg-blue-600 text-white px-3 py-1.5 rounded text-sm hover:bg-blue-700 shadow font-bold flex items-center gap-1"><i class="fas fa-id-card"></i> Cetak Kartu</button>
                                <button onclick="bulkDelete('siswa')" class="bg-red-500 text-white px-3 py-1.5 rounded text-sm hover:bg-red-600 shadow font-bold flex items-center gap-1"><i class="fas fa-trash"></i> Hapus Terpilih</button>
                            </div>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead class="bg-gray-100"><tr>
                                    <th class="p-2 border text-center w-12"><input type="checkbox" onchange="toggleAll(this, 'siswa')" class="w-4 h-4 cursor-pointer" title="Pilih Semua"></th>
                                    <th class="p-2 border">No. Ujian</th><th class="p-2 border">Username</th><th class="p-2 border">Nama</th><th class="p-2 border">Kelas</th><th class="p-2 border w-24">Aksi</th>
                                </tr></thead>
                                <tbody>${rows || '<tr><td colspan="6" class="text-center p-4">Data kosong.</td></tr>'}</tbody>
                            </table>
                        </div>
                    </div>`;
            } 
            else if (tab === 'guru') {
                let rows = db.users.filter(u => u.role === 'guru').map(u => {
                    let mapelNames = u.subjectIds?.map(sid => db.subjects.find(m => m.id === sid)?.name).join(', ') || 'Belum Diatur';
                    return `<tr class="border-b hover:bg-gray-50">
                        <td class="p-2 text-center"><input type="checkbox" class="chk-guru w-4 h-4 cursor-pointer" value="${u.id}"></td>
                        <td class="p-2">${u.username}</td><td class="p-2">${u.name}</td><td class="p-2 font-semibold text-blue-700">${mapelNames}</td>
                        <td class="p-2 flex gap-3">
                            <button onclick="editUser('${u.id}', 'guru')" class="text-blue-500 hover:text-blue-700" title="Edit"><i class="fas fa-edit"></i></button>
                            <button onclick="deleteUser('${u.id}', 'guru')" class="text-red-500 hover:text-red-700" title="Hapus"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>`;
                }).join('');
                content.innerHTML = `
                    <div class="bg-white p-6 rounded shadow">
                        <h2 class="text-xl font-bold mb-4" id="form_title_guru">Input Data Guru</h2>
                        <form class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6 bg-gray-50 p-4 border rounded items-start">
                            <div><label class="block text-xs font-bold mb-1">Username</label><input type="text" id="g_user" placeholder="Username" class="border p-2 rounded w-full" required></div>
                            <div><label class="block text-xs font-bold mb-1">Password</label><input type="text" id="g_pass" placeholder="Password" class="border p-2 rounded w-full" required></div>
                            <div><label class="block text-xs font-bold mb-1">Nama Lengkap</label><input type="text" id="g_name" placeholder="Nama Lengkap" class="border p-2 rounded w-full" required></div>
                            <div>
                                <label class="block text-xs font-bold mb-1">Mata Pelajaran</label>
                                <select id="g_mapel" class="border p-2 rounded w-full h-24" multiple required>${mapelOptions}</select>
                                <p class="text-xs text-gray-500 mt-1">*Tahan CTRL untuk memilih > 1 Mapel</p>
                            </div>
                            <div class="md:col-span-4 flex gap-2">
                                <button type="button" id="btn_submit_guru" onclick="addUser('guru')" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 font-bold shadow">Tambah Guru</button>
                                <button type="button" id="btn_cancel_guru" onclick="cancelEdit('guru')" class="hidden bg-gray-400 text-white px-4 py-2 rounded hover:bg-gray-500 font-bold shadow">Batal Edit</button>
                            </div>
                        </form>
                        <div class="flex justify-between items-center mb-2">
                            <h2 class="text-lg font-bold">Daftar Guru</h2>
                            <div class="flex gap-2">
                                <button onclick="document.getElementById('import_guru').click()" class="bg-green-600 text-white px-3 py-1.5 rounded text-sm hover:bg-green-700 shadow font-bold flex items-center gap-1"><i class="fas fa-file-excel"></i> Impor Data</button>
                                <input type="file" id="import_guru" class="hidden" accept=".csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.ms-excel" onchange="importData(event, 'guru')">
                                <button onclick="bulkDelete('guru')" class="bg-red-500 text-white px-3 py-1.5 rounded text-sm hover:bg-red-600 shadow font-bold flex items-center gap-1"><i class="fas fa-trash"></i> Hapus Terpilih</button>
                            </div>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead class="bg-gray-100"><tr>
                                    <th class="p-2 border text-center w-12"><input type="checkbox" onchange="toggleAll(this, 'guru')" class="w-4 h-4 cursor-pointer" title="Pilih Semua"></th>

        function addUser(role) {
            let u, p, n, k='', no='', m=[];
            if(role === 'siswa') {
                u = document.getElementById('s_user').value; p = document.getElementById('s_pass').value; n = document.getElementById('s_name').value;
                k = document.getElementById('s_kelas').value; no = document.getElementById('s_no').value;
            } else if (role === 'guru') {
                u = document.getElementById('g_user').value; p = document.getElementById('g_pass').value; n = document.getElementById('g_name').value;
                m = Array.from(document.getElementById('g_mapel').selectedOptions).map(opt => opt.value);
            } 
            if(!u || !p || !n) return alert('Isi semua field!');
            
            if (editUserId) {
                // Update mode
                const user = db.users.find(x => x.id === editUserId);
                if(user) {
                    user.username = u; user.password = p; user.name = n;
                    if(role === 'siswa') { user.kelas = k; user.noUjian = no; }
                    if(role === 'guru') { user.subjectIds = m; }
                }
                editUserId = null; // Reset
                alert('Data berhasil diperbarui!');
            } else {
                // Insert mode
                db.users.push({ id: generateId(), username: u, password: p, name: n, role: role, kelas: k, noUjian: no, subjectIds: m });
            }
            saveDB(); switchAdminTab(role);
        }

        /* --- FITUR IMPOR DATA EXCEL / CSV --- */
        function importData(event, role) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheet = workbook.SheetNames[0];
                const rows = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheet]);
                
                let imported = 0;
                rows.forEach(row => {
                    if (role === 'siswa') {
                        const u = row['Username'] || row['username'];
                        const p = row['Password'] || row['password'];
                        const n = row['Nama Lengkap'] || row['nama'] || row['Nama'];
                        const k = row['Kelas'] || row['kelas'];
                        const no = row['No. Ujian'] || row['no ujian'] || row['no_ujian'];
                        if (u && p && n) {
                            db.users.push({ id: generateId(), username: String(u), password: String(p), name: String(n), role: 'siswa', kelas: String(k||''), noUjian: String(no||''), subjectIds: [] });
                            imported++;
                        }
                    } else if (role === 'guru') {
                        const u = row['Username'] || row['username'];
                        const p = row['Password'] || row['password'];
                        const n = row['Nama Lengkap'] || row['nama'] || row['Nama'];
                        const mNames = row['Mata Pelajaran'] || row['mapel'] || '';
                        let mIds = [];
                        if (mNames) {
                            mNames.toString().split(',').forEach(mName => {
                                const sub = db.subjects.find(s => s.name.toLowerCase() === mName.trim().toLowerCase());
                                if(sub) mIds.push(sub.id);
                            });
                        }
                        if (u && p && n) {
                            db.users.push({ id: generateId(), username: String(u), password: String(p), name: String(n), role: 'guru', subjectIds: mIds });
                            imported++;
                        }
                    }
                });
                saveDB();
                switchAdminTab(role);
                alert(`Berhasil mengimpor ${imported} data ${role}.\n\nCatatan: Pastikan baris teratas Excel Anda memuat judul kolom (Username, Password, Nama Lengkap, dsb) secara spesifik.`);
            };
            reader.readAsArrayBuffer(file);
            event.target.value = ''; // Reset input agar bisa re-import file yang sama
        }

        /* --- CRUD & BULK ACTIONS HELPERS --- */
        function editUser(id, role) {
            const u = db.users.find(x => x.id === id);
            if(!u) return;
            editUserId = id;
            
            if(role === 'siswa') {
                document.getElementById('s_no').value = u.noUjian || '';
                document.getElementById('s_user').value = u.username;
                document.getElementById('s_pass').value = u.password;
                document.getElementById('s_name').value = u.name;
                document.getElementById('s_kelas').value = u.kelas || '';
                document.getElementById('btn_submit_siswa').innerText = 'Simpan Perubahan';
                document.getElementById('btn_cancel_siswa').classList.remove('hidden');
                document.getElementById('form_title_siswa').innerText = 'Edit Data Siswa';
            } else if (role === 'guru') {
                document.getElementById('g_user').value = u.username;
                document.getElementById('g_pass').value = u.password;
                document.getElementById('g_name').value = u.name;

        function generateToken() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'; let token=''; for(let i=0;i<6;i++) token+=chars.charAt(Math.floor(Math.random()*chars.length));
            db.examSettings.token = token; saveDB(); switchAdminTab('proktor');
        }

        function toggleExam(status) {
            if(status) {
                const checkboxes = document.querySelectorAll('.chk-active-mapel:checked');
                const selected = Array.from(checkboxes).map(cb => cb.value);
                if(selected.length === 0) return alert('Pilih minimal 1 mata pelajaran yang akan diaktifkan!');
                db.examSettings.activeSubjectIds = selected;
                db.examSettings.duration = parseInt(document.getElementById('proktor_durasi').value) || 120;
            } else {
                if(!confirm('Anda yakin ingin MENGHENTIKAN ujian secara keseluruhan?\nSemua peserta yang masih mengerjakan akan otomatis diselesaikan sistem.')) return;
                
                // Mengotomatiskan proses hitung nilai dan selesaikan semua yg ongoing
                db.examResults.forEach(res => {
                    if(res.status === 'ongoing' && db.examSettings.activeSubjectIds.includes(res.subjectId)) {
                        calculateAndSaveScore(res);
                    }
                });
            }
            db.examSettings.isRunning = status; saveDB(); switchAdminTab('proktor');
        }

        function calculateAndSaveScore(res) {
            const sq = db.questions.filter(q => q.subjectId === res.subjectId);
            let earned = 0, maxP = 0;
            sq.forEach(q => {
                let p = q.points || 10; maxP += p;
                if(res.answers && res.answers[q.id] === q.answer) earned += p;
            });
            res.score = maxP > 0 ? Math.round((earned / maxP) * 100) : 0;
            res.status = 'finished';
        }

        function forceStopStudent(sid, subjectId, isCheating) {
            const confirmMsg = isCheating 
                ? 'Tandai siswa ini melakukan KECURANGAN?\nUjian akan dihentikan paksa, nilai akan menjadi 0, dan status menjadi Pelanggaran.'
                : 'Paksa selesaikan ujian siswa ini?\nSistem akan menghentikan sesi siswa dan menghitung nilai dari jawaban yang ada.';
                
            if(confirm(confirmMsg)) {
                let res = db.examResults.find(r => r.studentId === sid && r.subjectId === subjectId);
                if(res) {
                    if(isCheating) {
                        res.score = 0;
                        res.status = 'cheated';
                    } else {
                        calculateAndSaveScore(res);
                    }
                    saveDB();
                    switchAdminTab('proktor');
                }
            }
        }

        function startExam() {
            const t = document.getElementById('tokenInput').value.toUpperCase();
            if(t !== db.examSettings.token) { alert('Token Ujian tidak valid!'); return; }

            // Ambil Mapel yang dipilih dari dropdown
            const selectMapel = document.getElementById('siswa_pilih_mapel');
            if (selectMapel) {
                currentStudentSubjectId = selectMapel.value;
            }

            if (!currentStudentSubjectId) {
                alert('Silakan pilih mata pelajaran ujian terlebih dahulu!');
                return;
            }

            examQuestions = db.questions.filter(q => q.subjectId === currentStudentSubjectId);
            if(examQuestions.length === 0) { alert('Belum ada soal tersedia untuk mata pelajaran ini.'); return; }
            
            const subject = db.subjects.find(s => s.id === currentStudentSubjectId);

            // Randomize Urutan Soal (Berdasarkan Pengaturan Guru)
            if (subject && subject.randomizeQuestions) {
                examQuestions.sort(() => Math.random() - 0.5); 
            }

            // Membangun opsi tampilan soal (Untuk Randomisasi Opsi A,B,C,D)
            examQuestions = examQuestions.map(q => {
                let mappedQ = {...q};
                mappedQ.displayOptions = mappedQ.options.map((opt, i) => ({text: opt, originalIndex: i}));
                
                // Randomize Urutan Jawaban (Berdasarkan Pengaturan Guru)
                if (subject && subject.randomizeOptions) {
                    mappedQ.displayOptions.sort(() => Math.random() - 0.5);
                }
                return mappedQ;
            });
            
            let res = db.examResults.find(r => r.studentId === currentUser.id && r.subjectId === currentStudentSubjectId);
            if(!res) {
                let endTime = Date.now() + (db.examSettings.duration * 60 * 1000);
                res = { studentId: currentUser.id, subjectId: currentStudentSubjectId, score: 0, status: 'ongoing', answers: {}, doubtful: {}, endTime: endTime };
                db.examResults.push(res);
            }
            saveDB();
            currentAnswers = res.answers || {}; currentDoubtful = res.doubtful || {};
            currentQIndex = 0; cheatWarnings = 0;
            isFinishingExam = false; // Reset flag saat mulai ujian

            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().then(() => { 
                    setupAntiCheat(); showExamUI(); startTimer(res.endTime); 
                }).catch(()=>{ alert('Browser menolak Fullscreen. Ujian gagal dimulai.'); });
            } else { alert('Gunakan browser Chrome/Edge terbaru.'); }
        }

        function startTimer(endTime) {
            clearInterval(examTimerInterval);
            const display = document.getElementById('examTimer');
            
            examTimerInterval = setInterval(() => {
                // Polling LocalStorage: Cek real-time apakah proktor menghentikan ujian
                const latestDbStr = localStorage.getItem(DB_KEY);
                if (latestDbStr) {
                    const latestDb = JSON.parse(latestDbStr);
                    // Kondisi 1: Proktor menghentikan semua ujian
                    if(!latestDb.examSettings.isRunning) {
                        clearInterval(examTimerInterval);
                        alert("INFORMASI:\nProktor telah menghentikan ujian. Anda akan diarahkan ke layar utama.");
                        forceLogoutSiswaLocal();
                        return;
                    }
                    // Kondisi 2: Proktor menghentikan siswa ini secara spesifik (via Selesai Paksa / Diskualifikasi)
                    const myRes = latestDb.examResults.find(r => r.studentId === currentUser.id && r.subjectId === currentStudentSubjectId);
                    if(myRes && myRes.status !== 'ongoing') {
                        clearInterval(examTimerInterval);
                        if(myRes.status === 'cheated') {
                            alert("UJIAN DIBATALKAN!\n\nProktor mendiskualifikasi Anda karena indikasi pelanggaran/kecurangan.");
                        } else {
                            alert("SESI BERAKHIR\n\nWaktu atau sesi ujian Anda telah diakhiri secara manual oleh Proktor.");
                        }
                        forceLogoutSiswaLocal();
                        return;
                    }
                }

                let rem = endTime - Date.now();
                if(rem <= 0) {
                    clearInterval(examTimerInterval); display.innerText = "00:00:00";
                    alert("WAKTU HABIS! Ujian akan ditutup otomatis dan hasil langsung disimpan.");
                    finishExam(false, true); // True = from timeout
                } else {
                    let h = Math.floor(rem / 3600000), m = Math.floor((rem % 3600000) / 60000), s = Math.floor((rem % 60000) / 1000);
                    display.innerText = String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
                }
            }, 1000);
        }

        function forceLogoutSiswaLocal() {
            // Reload DB terbaru tanpa overwrite data proktor
            initDB(); 
            isFinishingExam = true;
            removeAntiCheat();
            if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
            currentStudentSubjectId = null;
            document.querySelector('nav').classList.remove('hidden');
            document.getElementById('mainApp').classList.replace('p-2', 'p-4');
            document.getElementById('mainApp').classList.replace('h-screen', 'md:p-8');
            routeUser();
        }

        function showExamUI() {
            document.getElementById('preExamArea').classList.add('hidden');
            document.getElementById('activeExamArea').classList.remove('hidden');
            document.querySelector('nav').classList.add('hidden');
            document.getElementById('mainApp').classList.replace('p-4', 'p-2');
            document.getElementById('mainApp').classList.replace('md:p-8', 'h-screen');
            renderQuestion(); renderGrid();
        }

        function renderQuestion() {
            const q = examQuestions[currentQIndex];
            document.getElementById('qNumberDisplay').innerText = currentQIndex + 1;
            document.getElementById('qContent').innerHTML = `${q.image ? `<img src="${q.image}" class="max-w-full h-auto max-h-64 mx-auto mb-4 rounded border shadow-sm">` : ''}<p class="whitespace-pre-wrap">${q.text}</p>`;

            const selectedAns = currentAnswers[q.id];
            
            // Merender opsi jawaban menggunakan properti displayOptions (yang mungkin sudah diacak sesuai setting guru)
            document.getElementById('qOptions').innerHTML = q.displayOptions.map((optObj, idx) => `
                <label class="flex items-start sm:items-center p-3 sm:p-4 border rounded cursor-pointer transition ${selectedAns === optObj.originalIndex ? 'bg-blue-50 border-blue-500 ring-2 ring-blue-500 shadow-sm' : 'hover:bg-gray-50 border-gray-300'}">
                    <input type="radio" name="answer" value="${optObj.originalIndex}" class="hidden" ${selectedAns === optObj.originalIndex ? 'checked' : ''} onchange="selectAnswer(${optObj.originalIndex})">
                    <span class="w-6 h-6 sm:w-8 sm:h-8 flex-shrink-0 flex items-center justify-center rounded-full mr-3 sm:mr-4 text-xs sm:text-sm font-bold border-2 ${selectedAns === optObj.originalIndex ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-700 border-gray-400'} mt-0.5 sm:mt-0">${String.fromCharCode(65+idx)}</span> 
                    <span class="${selectedAns === optObj.originalIndex ? 'font-bold text-blue-900' : 'text-gray-800'} leading-snug text-sm sm:text-base break-words w-full">${optObj.text}</span>
                </label>`).join('');

            document.getElementById('chkRagu').checked = !!currentDoubtful[q.id];
            document.getElementById('btnPrev').disabled = currentQIndex === 0;

            if(currentQIndex === examQuestions.length - 1) {
                document.getElementById('btnNext').classList.add('hidden');
                document.getElementById('btnSelesai').classList.remove('hidden');
            } else {
                document.getElementById('btnNext').classList.remove('hidden');
                document.getElementById('btnSelesai').classList.add('hidden');
            }
        }

        function renderGrid() {
            document.getElementById('qNavGrid').innerHTML = examQuestions.map((q, idx) => {
                let ans = currentAnswers[q.id] !== undefined;
                let ragu = currentDoubtful[q.id];
                let cls = 'btn-number';
                if(ragu) cls += ' ragu'; else if(ans) cls += ' answered';
                if(currentQIndex === idx) cls += ' active';
                return `<button onclick="goToQ(${idx})" class="${cls}">${idx + 1}</button>`;
            }).join('');
        }

        function selectAnswer(originalIdx) {
            currentAnswers[examQuestions[currentQIndex].id] = originalIdx;
            syncDB(); renderQuestion(); renderGrid();
        }

        function toggleRagu() {
            currentDoubtful[examQuestions[currentQIndex].id] = document.getElementById('chkRagu').checked;
            syncDB(); renderGrid();
        }

        function syncDB() {
            let res = db.examResults.find(r => r.studentId === currentUser.id && r.subjectId === currentStudentSubjectId);
            if(res) { res.answers = currentAnswers; res.doubtful = currentDoubtful; saveDB(); }
        }

        function navigateQ(dir) { if (dir === 1 && currentQIndex === examQuestions.length - 1) return; currentQIndex += dir; renderQuestion(); renderGrid(); }
        function goToQ(idx) { currentQIndex = idx; renderQuestion(); renderGrid(); }

        /* Double Verification Finish Modal */
        function finishExamPrompt() {
            let answered = Object.keys(currentAnswers).length;
            let raguCount = Object.values(currentDoubtful).filter(Boolean).length;
            
            // Validasi: Cegah klik selesai jika belum dijawab semua atau masih ada yang ragu
            if (answered < examQuestions.length) {
                alert(`TIDAK DAPAT MENYELESAIKAN UJIAN!\n\nAnda baru menjawab ${answered} dari ${examQuestions.length} soal.\nHarap jawab semua soal yang tersedia terlebih dahulu.`);
                return;
            }
            if (raguCount > 0) {
                alert(`TIDAK DAPAT MENYELESAIKAN UJIAN!\n\nSistem mendeteksi ada ${raguCount} soal yang masih ditandai "Ragu-ragu".\nSilakan periksa kembali dan hilangkan tanda Ragu-ragu jika Anda sudah yakin.`);
                return;
            }

            // Modal Konfirmasi (Manual DOM inject untuk single-file)
            const overlay = document.createElement('div');
            overlay.className = "fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50";
            overlay.innerHTML = `
                <div class="bg-white p-6 rounded shadow-lg max-w-sm w-full text-center">
                    <i class="fas fa-exclamation-triangle text-4xl text-yellow-500 mb-4"></i>
                    <h2 class="text-xl font-bold mb-2">Konfirmasi Akhir</h2>
                    <p class="text-gray-600 text-sm mb-6">Anda telah menjawab seluruh soal dengan yakin. Anda tidak akan bisa masuk kembali ke ujian ini setelah menekan tombol Selesai.</p>
                    <label class="flex items-center justify-center gap-2 mb-6 cursor-pointer text-sm font-bold text-red-600 bg-red-50 p-2 border border-red-200 rounded">
                        <input type="checkbox" id="chkConfirmAkhir" class="w-5 h-5 accent-red-600" onchange="document.getElementById('btnRealSelesai').disabled = !this.checked; document.getElementById('btnRealSelesai').classList.toggle('opacity-50')">
                        Centang untuk menyatakan setuju.
                    </label>
                    <div class="flex gap-2">
                        <button onclick="this.closest('.fixed').remove()" class="flex-1 bg-gray-300 text-gray-800 font-bold py-2 rounded hover:bg-gray-400">BATAL</button>
                        <button id="btnRealSelesai" onclick="document.querySelector('.fixed').remove(); finishExam(false, false)" class="flex-1 bg-green-600 text-white font-bold py-2 rounded hover:bg-green-700 opacity-50 transition" disabled>SELESAI</button>
                    </div>
                </div>`;
            document.body.appendChild(overlay);
        }

        function setupAntiCheat() {
            document.addEventListener('fullscreenchange', handleFullscreenChange);
            document.addEventListener('visibilitychange', handleVisibilityChange);
            document.addEventListener('contextmenu', preventDefaultAction); document.addEventListener('copy', preventDefaultAction); document.addEventListener('paste', preventDefaultAction);
        }
        function removeAntiCheat() {
            document.removeEventListener('fullscreenchange', handleFullscreenChange); document.removeEventListener('visibilitychange', handleVisibilityChange);
            document.removeEventListener('contextmenu', preventDefaultAction); document.removeEventListener('copy', preventDefaultAction); document.removeEventListener('paste', preventDefaultAction);
        }
        
        const preventDefaultAction = (e) => e.preventDefault();
        
        function handleFullscreenChange() { 
            if (isFinishingExam) return; // Abaikan jika sedang proses logout/selesai
            if (!document.fullscreenElement) triggerCheat('Keluar dari mode layar penuh (Full Screen)'); 
        }
        
        function handleVisibilityChange() { 
            if (isFinishingExam) return; // Abaikan jika sedang proses logout/selesai
            if (document.hidden) triggerCheat('Berpindah tab atau menutup layar Ujian'); 
        }

        function triggerCheat(reason) {
            if (isFinishingExam) return;
            if (document.getElementById('cheatWarningModal')) return; // Cegah modal tumpuk

            cheatWarnings++;
            const maxWarnings = 2; // Batas peringatan sebelum diskualifikasi

            if (cheatWarnings > maxWarnings) {
                alert(`PELANGGARAN FATAL!\n\nSistem mendeteksi aktivitas mencurigakan berulang kali: ${reason}.\nSesuai aturan, ujian Anda dihentikan paksa.`);
                finishExam(true, false);
            } else {
                showCheatWarningModal(reason, maxWarnings - cheatWarnings + 1);
            }
        }

        function showCheatWarningModal(reason, sisa) {
            const overlay = document.createElement('div');
            overlay.className = "fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-[9999]";
            overlay.id = "cheatWarningModal";
            overlay.innerHTML = `
                <div class="bg-white p-6 rounded shadow-lg max-w-md w-full text-center mx-4">
                    <i class="fas fa-exclamation-triangle text-6xl text-red-600 mb-4 animate-pulse"></i>
                    <h2 class="text-2xl font-bold mb-2 text-red-600">PERINGATAN SISTEM!</h2>
                    <p class="text-gray-700 text-sm mb-4">Sistem anti-kecurangan mendeteksi aktivitas:<br><b class="text-red-600 text-base">${reason}</b></p>
                    <div class="bg-red-50 p-3 rounded border border-red-200 mb-6">
                        <p class="text-gray-800 text-xs text-left">Tindakan ini dilarang selama ujian berlangsung. Jika Anda terus mengulangi tindakan ini, ujian akan otomatis <b>dibatalkan</b>.</p>
                        <p class="mt-2 text-sm font-bold text-red-600">Sisa Toleransi Peringatan: ${sisa} kali</p>
                    </div>
                    <button onclick="closeCheatWarning()" class="w-full bg-red-600 text-white font-bold py-3 rounded-lg hover:bg-red-700 transition shadow-lg active:scale-95">SAYA MENGERTI & KEMBALI KE UJIAN</button>
                </div>`;
            document.body.appendChild(overlay);
        }

        function closeCheatWarning() {
            const modal = document.getElementById('cheatWarningModal');
            if (modal) modal.remove();
            
            // Paksa masuk fullscreen lagi setelah menutup peringatan
            const elem = document.documentElement;
            if (!document.fullscreenElement && elem.requestFullscreen) {
                elem.requestFullscreen().catch(()=>{});
            }
        }

        function finishExam(isCheat = false, isTimeout = false) {
            isFinishingExam = true; // Tandai sedang menyelesaikan agar anticheat tidak menyala
            removeAntiCheat(); 
            clearInterval(examTimerInterval);
            
            if (document.fullscreenElement) {
                document.exitFullscreen().catch(()=>{});
            }

            // Calculate Score based on Points
            let earned = 0, maxP = 0;
            examQuestions.forEach(q => {
                let p = q.points || 10; maxP += p;
                if(currentAnswers[q.id] === q.answer) earned += p;
            });
            const score = maxP > 0 ? Math.round((earned / maxP) * 100) : 0;

            let res = db.examResults.find(r => r.studentId === currentUser.id && r.subjectId === currentStudentSubjectId);
            if(res) {
                res.score = isCheat ? 0 : score;
                res.status = isCheat ? 'cheated' : 'finished';
                res.answers = currentAnswers; res.doubtful = currentDoubtful;
            }
            saveDB();

            currentStudentSubjectId = null; // Reset agar siswa bisa kembali ke layar pilih mapel jika ada mapel lain

            // Restore UI Layout
            document.querySelector('nav').classList.remove('hidden');
            document.getElementById('mainApp').classList.replace('p-2', 'p-4');
            document.getElementById('mainApp').classList.replace('h-screen', 'md:p-8');
            routeUser();
        }

        /* ==================== INITIALIZATION ==================== */
        initDB();

    </script>
